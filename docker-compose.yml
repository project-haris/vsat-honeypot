services:
  vsat-honeypot:
    build:
      context: .
    container_name: vsat-honeypot
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      VSAT_BIND: 0.0.0.0
      VSAT_PORT: 8080
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./logs:/app/logs
